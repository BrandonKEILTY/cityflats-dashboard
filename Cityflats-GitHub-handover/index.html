<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cityflats Dashboard</title>
<style>
  /* Layout: a quiet white header carrying the City Flats wordmark, a sticky
     bar to move between the portfolio overview and one property at a time,
     then each page read top to bottom: figures, decisions, leasing, work, money.
     One deliberate light look in KEILTY green, styled like the weekly recap email. */
  :root{
    color-scheme:light;
    --page:#F6F8F6; --card:#FFFFFF; --ink:#1A1A1A; --muted:#5A6B60; --faint:#7E8C83;
    --line:#C9D3CC; --line2:#E4EAE6;
    --green-ink:#0A3D1F; --green-tile:#EAF1EC; --navy:#0A3D1F; --navy-2:#155A31;
    --brass:#0A3D1F; --brass-tile:#EAF1EC;
    --good:#1F6B3A; --good-tile:#E3F0E7;
    --amber:#8A6410; --amber-tile:#FBF4E4; --amber-line:#EEDDB5;
    --red:#A32A18; --red-tile:#FBEDEA;
    --keilty:#0A3D1F;
    --font:Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
  @media(max-width:520px){.wrap{padding-inline:16px}}
  h1,h2,h3{text-wrap:balance}
  button,select{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* header */
  .mast{background:var(--card);border-bottom:1px solid var(--line)}
  .mast .wrap{padding-block:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .mast .cf{height:30px;width:auto;display:block}
  .mast .pipe{width:1px;height:24px;background:var(--line)}
  .mast .ttl{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);font-weight:bold}
  .mast .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12.5px;color:var(--muted)}
  .mast .asat{text-align:right;line-height:1.35;display:flex;gap:6px;align-items:baseline}
  .mast .asat b{color:var(--ink);font-size:14px}
  .kplate{background:var(--keilty);border-radius:3px;padding:5px 7px 4px;display:inline-flex}
  .kplate svg{width:54px;height:auto;display:block}
  .mby{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:640px){.mast .right{margin-left:0;width:100%;flex-direction:row;justify-content:space-between;align-items:center}}

  /* navigation: portfolio, or one property */
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
  .tabs .wrap{display:flex;gap:6px;align-items:center;padding-block:8px;flex-wrap:wrap}
  .tab{background:none;border:1px solid transparent;border-radius:8px;padding:8px 14px;font-weight:bold;font-size:14px;color:#CFE0D5;cursor:pointer;white-space:nowrap}
  .tab:hover{color:#fff}
  .tab.on{background:#fff;color:var(--navy)}
  .crumb{color:#9DBBA7;font-size:14px;padding:0 2px}
  .picker{position:relative}
  .picker select{appearance:none;-webkit-appearance:none;background:transparent;border:1px solid #3F6B50;color:#fff;border-radius:8px;padding:8px 34px 8px 14px;font-weight:bold;font-size:14px;cursor:pointer;max-width:72vw}
  .picker select.on{background:#fff;color:var(--navy);border-color:#fff}
  .picker select option{color:#16202A;background:#fff}
  .picker::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:#CFE0D5}
  .picker.on::after{color:var(--navy)}
  .tools{margin-left:auto;display:flex;align-items:center;gap:8px}
  .toggle{border:1px solid #3F6B50;background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:#CFE0D5}
  .toggle[aria-pressed="true"]{color:#fff;border-color:#9DBBA7}

  main{padding-block:8px 70px}

  /* section heading, per the KEILTY document standard */
  .sh{display:flex;align-items:baseline;gap:12px;margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sh h2{margin:0;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
  .sh .aside{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
  .lede{margin:-4px 0 14px;color:var(--muted);font-size:14px;max-width:75ch}

  .phead{margin-top:30px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
  .phead h2{margin:0;font-size:26px;letter-spacing:-.01em}
  .phead .meta{color:var(--muted);font-size:14px}

  /* the recap email's table: group label, measure, figure, change */
  .stat{display:grid;gap:0 28px;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 18px 12px}
  @media(min-width:900px){.stat.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .sg{min-width:0}
  .sg .gl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 0 7px;border-bottom:1px solid var(--line)}
  .sr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .sr .k{font-size:14.5px;min-width:0}
  .sr .v{font-size:19px;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .sr .ch2{grid-column:1/-1;font-size:12px;font-weight:bold;color:var(--muted);text-align:right}
  .sr .ch2.up{color:var(--good)} .sr .ch2.dn{color:var(--red)}
  .sr .sub{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.45}
  @media(min-width:520px) and (max-width:899px){.stat{padding-inline:22px}.sr{grid-template-columns:minmax(0,1fr) 90px 180px}.sr .ch2{grid-column:auto}}
  /* trends */
  .tg{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:760px){.tg{grid-template-columns:1fr 1fr}}
  .tc{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0;display:flex;flex-direction:column}
  .tc .th{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 2px}
  .tc .tn{font-weight:bold;font-size:14.5px}
  .tc .tv{margin-left:auto;font-size:22px;font-weight:bold;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .tc .td{width:100%;font-size:12.5px;color:var(--muted)}
  .tc .td.up{color:var(--good)} .tc .td.dn{color:var(--red)}
  .tc svg{display:block;width:100%;height:auto;padding:4px 6px 0}
  .tc .lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:2px 16px 8px}
  .tc .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .tc .lg i.ln{height:3px;border-radius:2px;width:16px;vertical-align:3px}
  .tc .tw{margin-top:auto;padding:10px 16px 13px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--muted);line-height:1.5}
  /* financial panels, closed until opened */
  details.fin{background:var(--card);border:1px solid var(--line);border-radius:10px}
  details.fin+details.fin{margin-top:10px}
  details.fin>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:4px 14px;padding:13px 16px;align-items:baseline}
  details.fin>summary::-webkit-details-marker{display:none}
  details.fin>summary::after{content:"+";color:var(--green-ink);font-weight:bold;text-align:right}
  details.fin[open]>summary::after{content:"\2212"}
  details.fin>summary:hover{background:var(--green-tile)}
  .fin .ft{font-weight:bold;font-size:14.5px}
  .fin .ft small{display:block;font-weight:normal;color:var(--muted);font-size:13px;margin-top:2px}
  .fin .fv{font-size:18px;font-weight:bold;font-variant-numeric:tabular-nums;text-align:right}
  .fin .fv.none{font-size:12px;font-weight:bold;color:var(--muted)}
  .kvr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 16px;border-top:1px solid var(--line2);font-size:14px;align-items:baseline}
  .kvr b{font-variant-numeric:tabular-nums}
  .soon{display:inline-block;font-size:11px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--line2);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .fin .fnote{padding:10px 16px 13px;border-top:1px solid var(--line2);font-size:13px;color:var(--muted)}
  .later{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .later b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:4px}
  /* overview leased bar */
  .lbar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
  .lbar i{display:block;height:100%;background:var(--green-ink);border-radius:4px}
  details.wk{border-top:1px solid var(--line2)}
  details.wk>summary{cursor:pointer;list-style:none;padding:11px 16px;font-size:13px;font-weight:bold;color:var(--green-ink)}
  details.wk>summary::-webkit-details-marker{display:none}
  /* stacking plan */
  .stk{padding:14px 16px 6px;display:grid;gap:5px;overflow-x:auto}
  .sfl{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;min-width:520px}
  .sfn{font-size:11px;font-weight:bold;color:var(--muted);text-align:right}
  .sru{display:grid;gap:4px}
  .su{height:30px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:bold;font-variant-numeric:tabular-nums;cursor:default}
  .su-available{border:1px solid var(--line)}
  .stk .sru .su[data-tip]{height:38px;flex-direction:column;line-height:1.1;gap:1px;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .su .bd{font-size:9.5px;font-weight:normal;opacity:.85;letter-spacing:.02em}
  .su[data-tip]:hover,.su[data-tip]:focus-visible,.su[data-tip].on{transform:translateY(-2px);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--green-ink),0 4px 10px rgba(10,61,31,.25);outline:none;z-index:2;position:relative}
  .sutip{position:fixed;z-index:50;max-width:260px;background:#fff;color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--green-ink);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:10px 12px;font-size:12.5px;line-height:1.45;pointer-events:none;display:none}
  .sutip b.h{display:block;font-size:14px;margin-bottom:2px}
  .sutip .st{display:inline-block;font-size:10.5px;font-weight:bold;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;margin:2px 0 6px}
  .sutip .r{display:flex;justify-content:space-between;gap:14px;border-top:1px solid var(--line2);padding:3px 0}
  .sutip .r span{color:var(--muted)} .sutip .r b{font-variant-numeric:tabular-nums}
  .stkhint{font-size:12px;color:var(--muted);font-weight:normal}
  .su-model{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(0,0,0,.06) 4px 8px)}
  .skey{display:flex;gap:8px 18px;flex-wrap:wrap;padding:8px 16px 12px;font-size:12.5px;color:var(--muted)}
  .skey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
  .skey i.su-available{border:1px solid var(--line)}
  .skey b{color:var(--ink);margin-left:2px}
  .cu-h{padding:10px 16px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line2)}
  .ch+.cu-h{border-top:0}
  .cu-h b{color:var(--ink)}
  .cu-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:4px 14px;padding:9px 16px;border-top:1px solid var(--line2);font-size:13.5px}
  .cu-r span:first-child{font-weight:bold}
  @media(max-width:560px){.cu-r{grid-template-columns:1fr}}
  /* missing from the Entrata package */
  .miss{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap;vertical-align:1px}
  .miss.big{font-size:12.5px;padding:6px 14px}
  .missrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--red-tile);border:2px solid var(--red);border-radius:10px;padding:14px 16px}
  .missrow+.missrow{margin-top:8px}
  .missrow div{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 240px}
  .missrow span:not(.miss){font-size:13px;color:var(--muted)}
  .tracker{margin-top:18px;background:var(--red-tile);border:2px solid var(--red);border-radius:12px;padding:14px 16px}
  .tk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .tk-p{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:bold;margin:10px 0 2px}
  .tk-r{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid rgba(163,42,24,.18);font-size:13.5px}
  .jump button.hasmiss{border-color:var(--red);color:var(--red)}
  .srcchip{display:inline-block;font-size:10.5px;letter-spacing:.04em;color:var(--muted);background:var(--green-tile);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .ch .srcchip{margin-left:auto}
  .trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:4px 14px;padding:12px 16px;border-top:1px solid var(--line2);font-size:13.5px}
  .trow .who{font-weight:bold}
  .trow .who small{display:block;font-weight:normal;color:var(--faint);font-size:12.5px;margin-top:2px}
  @media(max-width:600px){.trow{grid-template-columns:1fr}}
  .checks{margin-top:34px;background:var(--amber-tile);border:1px solid var(--amber-line);border-radius:10px;padding:14px 18px;font-size:13.5px}
  .checks b{color:var(--amber);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .checks ul{margin:8px 0 0;padding-left:18px}
  .checks li{margin:4px 0}
  .miss.fix{background:var(--amber)}
  .missrow.fix{background:var(--amber-tile);border-color:var(--amber)}
  .missrow+.card,.missrow+.stat{margin-top:10px}
  .jump button.hasfix{border-color:var(--amber);color:var(--amber)}
  .srcchip.cc{background:var(--amber-tile);color:var(--amber)}
  .srcline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.srcline:empty{display:none}
  .sr .sub .srcchip{margin-left:0}
  .ch .srcchip+.srcchip{margin-left:6px}
  .gl .srcchip{margin-left:6px;text-transform:none;letter-spacing:0}
  tr.ccrow td{background:var(--page);color:var(--muted)}
  tr.ccrow td b{color:var(--muted)}
  body:not(.team) .sr .miss,body:not(.team) .fnote .miss{display:none}
  .miss.cc{background:#5A6B60}
  .miss.team{background:#3E6A8A}
  .miss.prog{background:#2F6F73}
  .tracker.calm{background:#F1F6F6;border-color:#9FC2C4}
  .tracker.calm .tk-p{color:#2F6F73}
  .tracker.calm .tk-r{border-top-color:#D3E3E4}
  .missrow.prog{background:#E8F2F2;border-color:#2F6F73}
  /* jump bar */
  .jump{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 0}
  .jump button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--muted)}
  .jump button:hover{border-color:var(--green-ink);color:var(--green-ink)}
  .sh{scroll-margin-top:72px}
  /* figures */
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
  .kpi{background:var(--card);padding:15px 16px 14px;min-width:0;border:1px solid var(--line);border-radius:10px}
  .kpi .v{font-size:28px;font-weight:bold;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:7px;font-weight:bold}
  .kpi .d{font-size:12.5px;color:var(--faint);margin-top:4px}
  .d.good{color:var(--good)} .d.bad{color:var(--red)}
  .kpi .bar{height:6px;background:var(--line2);border-radius:3px;margin-top:9px;overflow:hidden}
  .kpi .bar i{display:block;height:100%;background:var(--green-ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card+.card{margin-top:12px}
  .ch{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line2)}
  .ch .t{font-weight:bold;font-size:14.5px}
  .ch .c{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .pad{padding:14px 16px}

  .g2{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:860px){.g2{grid-template-columns:1fr 1fr}}
  .g2>*{min-width:0}

  /* awaiting your input */
  .wait{background:var(--amber-tile);border:1px solid var(--amber-line);border-radius:10px;padding:4px 16px}
  .wrow{display:grid;grid-template-columns:110px 1fr auto;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--amber-line);align-items:baseline}
  .wrow:last-child{border-bottom:0}
  .wrow .a{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);font-weight:bold}
  .wrow .w{font-weight:bold;min-width:0}
  .wrow .l{grid-column:2;color:var(--muted);font-size:13.5px;font-weight:normal}
  .wrow .s{font-size:12.5px;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
  .wrow .s b{display:block;font-size:15px}
  @media(max-width:560px){.wrow{grid-template-columns:1fr auto}.wrow .a{grid-column:1/-1}.wrow .l{grid-column:1/-1}}

  /* lease-up */
  .lu-top{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;padding:14px 16px 0}
  .lu-top .big{font-size:18px;font-weight:bold}
  .lu-top .tg{color:var(--muted);font-size:13.5px}
  .chart{padding:6px 10px 0;overflow-x:auto}
  .chart svg{display:block;width:100%;min-width:560px;height:auto}
  .key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:6px 16px 12px}
  .key i{display:inline-block;width:22px;height:0;border-top:3px solid var(--green-ink);vertical-align:middle;margin-right:6px}
  .key .k2 i{border-top-style:dashed;border-color:var(--faint)}
  .key .k3 i{border-top:3px dotted var(--red)}
  .key .k4 i{border-top:3px dotted var(--amber)}
  .paces{display:grid;gap:1px;background:var(--line2);border-top:1px solid var(--line2);grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .paces>div{background:var(--card);padding:12px 16px}
  .paces .v{font-size:21px;font-weight:bold;font-variant-numeric:tabular-nums}
  .paces .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:bold;margin-top:4px}
  .paces .m{font-size:12.5px;color:var(--faint);margin-top:2px}
  .verdict{margin:0;padding:14px 16px;border-top:1px solid var(--line2);font-size:14.5px}
  .verdict b{color:var(--red)}
  .verdict b.ok{color:var(--good)}

  /* funnel */
  .fun{padding:6px 16px 10px}
  .fs{display:grid;grid-template-columns:1fr 70px;gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:center}
  .fs:last-child{border-bottom:0}
  .fs .n{font-weight:bold}
  .fs .w{font-size:13px;color:var(--muted)}
  .fs .c{font-size:24px;font-weight:bold;text-align:right;font-variant-numeric:tabular-nums;grid-row:1/span 3;grid-column:2}
  .fs .b{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;max-width:460px}
  .fs .b i{display:block;height:100%;background:var(--green-ink);border-radius:4px}
  .conv{display:flex;gap:10px 22px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line2);font-size:13.5px;color:var(--muted)}
  .conv b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}

  /* tables */
  .sc{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:bold}

  th:last-child,td:last-child{padding-right:16px}

  tr.now td{background:var(--green-tile);font-weight:bold}
  .dim{color:var(--faint)}
  .foot{padding:10px 16px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line2)}

  /* stage pills */
  .pill{display:inline-block;font-size:10.5px;font-weight:bold;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--line2);color:var(--muted)}
  .pill.g{background:var(--good-tile);color:var(--good)}

  .pill.a{background:var(--amber-tile);color:var(--amber)}
  .pill.r{background:var(--red-tile);color:var(--red)}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
  .chip b{color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{border-color:var(--green-ink);background:var(--green-tile);color:var(--green-ink);font-weight:bold}
  .chip[aria-pressed="true"] b{color:var(--green-ink)}

  /* expandable rows: leads, work orders, items */
  details.row{border-bottom:1px solid var(--line2)}
  details.row:last-child{border-bottom:0}
  details.row>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) auto 16px;gap:4px 14px;padding:12px 16px;align-items:baseline}
  details.row>summary::-webkit-details-marker{display:none}
  details.row>summary:hover{background:var(--green-tile)}
  details.row>summary::after{content:"+";color:var(--green-ink);font-weight:bold;text-align:right}
  details.row[open]>summary::after{content:"\2212"}
  .who{font-weight:bold;min-width:0}
  .who small{display:block;font-weight:normal;color:var(--faint);font-size:12.5px;margin-top:1px}
  .last{min-width:0;font-size:13.5px}
  .last .dt{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;margin-right:6px}
  .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .right .age{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
  .right .age.late{color:var(--red);font-weight:bold}
  @media(max-width:640px){
    details.row>summary{grid-template-columns:minmax(0,1fr) auto 16px}
    details.row>summary .last{grid-column:1/3;grid-row:2}
  }
  .hist{margin:0;padding:2px 16px 14px 16px;list-style:none;display:grid;gap:8px}
  .hist li{display:grid;grid-template-columns:92px 1fr;gap:12px;font-size:13.5px;padding-left:12px;border-left:2px solid var(--line)}
  .hist li:first-child{border-left-color:var(--green-ink)}
  .hist .dt{color:var(--faint);font-variant-numeric:tabular-nums}
  .hist .meta{grid-column:1/-1;color:var(--muted);font-size:12.5px;border-left:0;padding-left:0}
  .empty{padding:16px;color:var(--muted);font-size:14px}

  /* tours */
  .tour{display:grid;grid-template-columns:110px 70px 1fr auto;gap:4px 14px;padding:11px 16px;border-bottom:1px solid var(--line2);align-items:baseline}
  .tour:last-child{border-bottom:0}
  .tour .d1{font-weight:bold;font-variant-numeric:tabular-nums}
  .tour .d2{font-variant-numeric:tabular-nums;color:var(--muted)}
  .tour .rel{font-size:12.5px;color:var(--faint);white-space:nowrap}
  @media(max-width:520px){.tour{grid-template-columns:100px 1fr}.tour .rel{grid-column:1/-1}}

  /* money */
  .money{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .money .kpi{border:1px solid var(--line);border-radius:10px}
  .v.ok{color:var(--good)} .v.bad{color:var(--red)}

  .note{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;font-size:14px;color:var(--muted);margin-top:12px}
  .note b{color:var(--ink)}

  /* overview */
  .ov{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:860px){.ov{grid-template-columns:1fr 1fr}}
  .ovc{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:10px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .ovc h3{margin:0;font-size:20px}
  .ovc .meta{color:var(--muted);font-size:13.5px;margin-top:-8px}
  .ovc dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:0;font-size:14px}
  .ovc dt,.ovc dd{padding:8px 0;border-bottom:1px solid var(--line2);margin:0}

  .go{align-self:flex-start;border:1px solid var(--navy);color:#fff;background:var(--navy);border-radius:8px;padding:8px 14px;font-weight:bold;font-size:13.5px;cursor:pointer}
  .go:hover{background:var(--navy-2)}
  .rep{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line2);font-size:14px}
  .rep:last-child{border-bottom:0}
  .rep span{color:var(--faint);font-variant-numeric:tabular-nums}

  footer{border-top:1px solid var(--line);margin-top:44px;padding-top:16px;font-size:12px;color:var(--muted);line-height:1.7}
  footer b{color:var(--keilty);letter-spacing:.04em}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
  var F = window.CLIENT_FEED;
  var main = document.getElementById("main");
  if(!F){ main.innerHTML='<p class="empty">This page could not load its figures. Refresh, and if it stays blank let your KEILTY contact know.</p>'; return; }
  var VIEW="overview", TODAY=F.asAt, FILTER={};
  /* Team view shows the internal tracking (red and amber flags, checks, source map).
     Open the page with #team to switch it on for this browser; clients never see it. */
  /* Working notes (flags, checks, sources) are on by default. "Hide working notes"
     turns them off in this browser, for a clean view; #team turns them back on. */
  /* Working notes are retired: the page always shows the client view. Opening it with #team still shows them, for KEILTY only. */
  var TEAM=(location.hash||"")==="#team";

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function day(s){ return new Date(String(s).slice(0,10)+"T00:00:00"); }
  function daysBetween(a,b){ return Math.round((day(b)-day(a))/86400000); }
  function money(n){ return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function m0(n){ return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-CA"); }
  function p1(a,b){ return b? Math.round(a/b*1000)/10 : 0; }
  function r1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function prevDay(s){ var d=day(s); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
  function dhm(s){ var m=/^(\d+):(\d+):(\d+)$/.exec(s||""); return m? (+m[1])+" d "+(+m[2])+" h" : ""; }

  /* ---------- where each figure comes from ---------- */
  var SRC={E:"Entrata",C:TEAM?"Command Center":"KEILTY team"};
  function chip(kind,name){ return ""; }  /* source pills retired: the client view does not name report sources */
  var USED=[];  /* every source used on the page, collected as it is drawn */
  function use(sec,kind,name){ USED.push([sec,kind,name]); return chip(kind,name); }

  /* ---------- red pills (missing) and amber pills (fix the package) ---------- */
  function flags(p,sec){
    return "";  /* flags live only in the working notes (tracker, checks, sources) */
    if(!TEAM) return "";
    return (p.missing||[]).filter(function(m){ return m.sec===sec; }).map(function(m){
      if(m.level==="cc"||m.level==="team") return "";
      if(m.level==="progress") return '<div class="missrow prog"><span class="miss big prog">In progress</span><div><b>'+esc(m.what)+'</b><span>'+esc(m.need)+'.</span></div></div>';
      var red=m.level!=="fix";
      return '<div class="missrow'+(red?'':' fix')+'"><span class="miss big'+(red?'':' fix')+'">'+(red?'Missing':'Fix in the package')+'</span><div><b>'+esc(m.what)+'</b><span>'+(red?'Needs ':'')+esc(m.need)+'.</span></div></div>'; }).join("");
  }
  function tracker(list){
    if(!TEAM) return "";
    var n=0, fx=0, cn=0, tm=0, pg=0; list.forEach(function(x){ x[1].forEach(function(m){ if(m.level==="fix") fx++; else if(m.level==="cc") cn++; else if(m.level==="team") tm++; else if(m.level==="progress") pg++; else n++; }); });
    if(!n&&!fx&&!cn&&!tm&&!pg) return "";
    var lab={missing:["","Missing"],fix:[" fix","Fix"],cc:[" cc","Command Center"],team:[" team","Stays with the team"],progress:[" prog","In progress"]};
    return '<div class="tracker'+(n||fx?'':' calm')+'"><div class="tk-h">'+(n?'<span class="miss big">'+n+' missing</span>':'')+(fx?'<span class="miss big fix">'+fx+' to fix</span>':'')+(cn?'<span class="miss big cc">'+cn+' still from the Command Center</span>':'')+(pg?'<span class="miss big prog">'+pg+' in progress</span>':'')+(tm?'<span class="miss big team">'+(list.length>1?Math.round(tm/list.length):tm)+' updated by the team</span>':'')+'<b>Where everything stands on coming from Entrata</b></div>'+
      list.map(function(x){ return (list.length>1&&x[1].some(function(m){return m.level!=="team";})?'<div class="tk-p">'+esc(x[0])+'</div>':'')+x[1].filter(function(m){ return m.level!=="team"; }).slice().sort(function(a,b){ var o={missing:0,fix:1,progress:2,cc:3,team:4}; return o[a.level||"missing"]-o[b.level||"missing"]; }).map(function(m){ var L=lab[m.level]||lab.missing; return '<div class="tk-r"><span class="miss'+L[0]+'">'+L[1]+'</span><span><b>'+esc(m.what)+'</b> · '+esc(m.need)+'</span></div>'; }).join(""); }).join("")+teamBlock(list)+'</div>';
  }
  /* what the team still updates on the Command Center, once for the whole list */
  function teamBlock(list){
    var seen={}, items=[]; list.forEach(function(x){ x[1].forEach(function(m){ if(m.level==="team"&&!seen[m.what]){ seen[m.what]=1; items.push(m); } }); });
    if(!items.length) return "";
    return '<div class="tk-p" style="color:#3E6A8A">What the team updates on the Command Center</div>'+items.map(function(m){ return '<div class="tk-r"><span class="miss team">Team</span><span><b>'+esc(m.what)+'</b> · '+esc(m.need)+'</span></div>'; }).join("");
  }

  function srow(k,v,c,sub){ return '<div class="sr"><span class="k">'+k+'</span><span class="v">'+v+'</span>'+(c||'<span class="ch2"></span>')+(sub?'<span class="sub">'+sub+'</span>':'')+'</div>'; }
  function chg(now,was,goodUp,unit){
    if(now==null) return '<span class="ch2"></span>';
    if(was==null) return '<span class="ch2">No prior week to compare</span>';
    var d=Math.round((now-was)*10)/10; if(d===0) return '<span class="ch2">No change vs last week</span>';
    var up=d>0, good=goodUp?up:!up;
    return '<span class="ch2 '+(good?"up":"dn")+'">'+(up?"▲ ":"▼ ")+Math.abs(d)+(unit||"")+' vs last week</span>';
  }
  function stat(groups){ return '<div class="stat c'+groups.length+'">'+groups.map(function(g){ return '<div class="sg"><div class="gl">'+g[0]+(g[2]?' '+g[2]:'')+'</div>'+g[1].join("")+'</div>'; }).join("")+'</div>'; }
  function sh(id,title,aside){ return '<div class="sh" id="'+id+'"><h2>'+title+'</h2>'+(aside?'<span class="aside">'+aside+'</span>':'')+'</div>'; }
  function last(p){ return p.weeks[p.weeks.length-1]; }
  function prev(p){ return p.weeks[p.weeks.length-2]||{}; }

  /* ---------- tabs ---------- */
  function paintTabs(){
    var onP=VIEW!=="overview";
    document.getElementById("tabs").innerHTML='<button class="tab'+(onP?"":" on")+'" data-v="overview">Portfolio overview</button><span class="crumb" aria-hidden="true">/</span>'+
      '<label class="picker'+(onP?" on":"")+'"><span style="position:absolute;left:-9999px">Choose a property</span><select id="propsel" class="'+(onP?"on":"")+'">'+
      '<option value="overview"'+(onP?"":" selected")+'>Select a property</option>'+
      F.properties.map(function(p){ return '<option value="'+p.id+'"'+(VIEW===p.id?" selected":"")+'>'+esc(p.name)+' ('+p.units+' suites)</option>'; }).join("")+'</select></label>';
  }

  /* ---------- overview ---------- */
  function leasedOf(p){ return p.mode==="leaseup"? p.counts.leased : p.counts.occupied+p.counts.leased; }
  function overview(){
    var h='<div class="phead"><h2>Portfolio overview</h2></div>';
    h+=tracker(F.properties.map(function(p){ return [p.name,p.missing||[]]; }));
    if(TEAM){
      var CL=F.weeklyChecklist||[], tag={done:['<span class="srcchip">Entrata</span>'],fix:['<span class="miss fix">Fix</span>'],missing:['<span class="miss">Missing</span>'],cc:['<span class="miss cc">Command Center</span>'],team:['<span class="miss team">Stays with the team</span>'],progress:['<span class="miss prog">In progress</span>']};
      var open=CL.filter(function(x){ return x[2]!=="done"; }).length;
      h+='<div class="card" style="margin-top:14px"><div class="ch"><span class="t">Replacing the team\u2019s weekly update</span><span class="c">'+(CL.length-open)+' of '+CL.length+' now from Entrata</span></div>'+
        '<div class="pad cap">Everything the team used to send each week, and where it comes from now. Anything not marked Entrata still needs a report or a decision.</div>'+
        '<div class="sc"><table><thead><tr><th>From the weekly update</th><th>Now</th><th>Source</th></tr></thead><tbody>'+
        CL.slice().sort(function(a,b){ var o={missing:0,fix:1,progress:2,cc:3,team:4,done:5}; return o[a[2]]-o[b[2]]; }).map(function(x){ return '<tr><td><b>'+esc(x[0])+'</b></td><td>'+tag[x[2]][0]+'</td><td>'+esc(x[1])+'</td></tr>'; }).join("")+'</tbody></table></div></div>';
      F.properties.forEach(function(p){ var L=p.toCapture||[]; if(!L.length) return;
        h+='<div class="card" style="margin-top:12px"><div class="ch"><span class="t">'+esc(p.name)+': '+L.length+' prospects still to be logged in Entrata</span><span class="miss prog">In progress</span></div>'+
          '<div class="pad cap">The team tracked these in the weekly update and is now logging each one in the Entrata Activity Log. Each moves into Active prospects, and off this list, as its first entry comes through.</div>'+
          '<details class="wk"><summary>Show the '+L.length+' prospects</summary><div class="sc"><table><thead><tr><th>Prospect</th><th>Suite</th><th>Last known stage</th><th>Last team note</th></tr></thead><tbody>'+
          L.map(function(x){ return '<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.unit||"\u2014")+'</td><td>'+esc(x.stage)+'</td><td>'+esc(x.last)+'</td></tr>'; }).join("")+'</tbody></table></div></details></div>';
      });
    }
    h+=sh("ov-props","Properties","select one to see its full detail")+'<div class="ov">';
    F.properties.forEach(function(p){
      var c=p.counts, L=leasedOf(p), lp=p1(L,p.rentable);
      h+='<div class="ovc"><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(p.address)+' · '+esc(p.entity)+'</div>'+
        '<div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><b style="font-size:22px">'+lp.toFixed(1)+'% leased</b><span class="dim" style="font-size:13px">'+L+' of '+p.rentable+' rentable</span></div><div class="lbar"><i style="width:'+lp+'%"></i></div></div><dl>'+
        (p.mode==="leaseup"?'<dt>Leases in progress</dt><dd>'+c.inProgress+'</dd>':'<dt>Occupied</dt><dd>'+c.occupied+'</dd>')+
        '<dt>Available</dt><dd>'+c.available+'</dd><dt>New leads (guest cards)</dt><dd>'+((p.history||[]).slice(-1)[0]||{}).leads+'</dd>'+
        '<dt>Owed by residents</dt><dd>'+money(p.arrears.owing)+'</dd><dt>Awaiting your input</dt><dd>'+p.waiting.length+'</dd></dl>'+
        '<div class="srcline">'+chip("E","Availability, Rent Roll, Lease Term Progress, Receivables")+chip("C","open items")+'</div>'+
        '<button class="go" data-v="'+p.id+'">View '+esc(p.name)+' in detail</button></div>';
    });
    h+='</div>';
    var all=[]; F.properties.forEach(function(p){ p.waiting.forEach(function(x){ all.push([p,x]); }); });
    all.sort(function(a,b){ return a[1].since<b[1].since?-1:1; });
    h+=sh("ov-wait","Awaiting your input","across the portfolio "+chip("C","open items"))+waitBlock(all.map(function(r){ return {area:r[1].area,what:r[1].what,since:r[1].since,last:r[1].last,prop:r[0].name}; }));
    return h;
  }
  function waitBlock(rows){
    if(!rows.length) return '<div class="note">Nothing needs your input this week.</div>';
    return '<div class="wait">'+rows.map(function(x){ var d=daysBetween(x.since,TODAY);
      return '<div class="wrow"><div class="a">'+esc(x.area)+'</div><div class="w">'+esc(x.what)+(x.prop?' <span class="dim" style="font-weight:normal">· '+esc(x.prop)+'</span>':'')+'</div><div class="s"><b>'+(d===0?"new":d+" d")+'</b>since '+esc(x.since)+'</div><div class="l">'+esc(x.last)+'</div></div>'; }).join("")+'</div>';
  }

  /* ---------- charts ---------- */
  function mlab(m){ return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m.slice(5,7)-1]; }
  function niceMax(v){ if(v<=0) return 1; var q=Math.pow(10,Math.floor(Math.log10(v))), n=v/q; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*q; }
  function tchart(o){
    var W=460,H=180,P={l:46,r:o.rmax?40:12,t:12,b:24},n=o.labels.length,bw=(W-P.l-P.r)/n;
    var bars=o.series.filter(function(s){return s.kind==="bar";}), lines=o.series.filter(function(s){return s.kind==="line";});
    var lv=[]; o.series.forEach(function(s){ if(s.axis!=="r") s.vals.forEach(function(v){ if(v!=null) lv.push(Math.abs(v)); }); });
    var mx=o.lmax||niceMax(Math.max.apply(null,lv.concat([1]))), mn=o.allowNeg? -mx : 0;
    var lab=o.lab||mlab;
    function Y(v,ax){ if(ax==="r") return H-P.b-(v/o.rmax)*(H-P.t-P.b); return H-P.b-((v-mn)/(mx-mn))*(H-P.t-P.b); }
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.title)+'">';
    (o.allowNeg?[-1,0,1]:[0,.5,1]).forEach(function(f){ var v=mx*f, y=Y(v); s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line2)"/><text x="'+(P.l-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10.5" fill="var(--faint)">'+(o.fmt?o.fmt(v):(v%1?v.toFixed(1):v))+'</text>';
      if(o.rmax) s+='<text x="'+(W-P.r+6)+'" y="'+(Y(o.rmax*(o.allowNeg?(f+1)/2:f),"r")+4)+'" font-size="10.5" fill="var(--faint)">'+Math.round(o.rmax*(o.allowNeg?(f+1)/2:f))+'%</text>'; });
    var gw=bw*.62, each=gw/Math.max(1,bars.length), base=Y(0);

    var r=el.getBoundingClientRect(), w=TIP.offsetWidth, h=TIP.offsetHeight, x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8), y=r.top-h-10; if(y<8) y=r.bottom+10;
    TIP.style.left=x+"px"; TIP.style.top=y+"px"; }
  function hideTip(){ if(TIPON) TIPON.classList.remove("on"); TIPON=null; TIP.style.display="none"; }
  function tipEl(e){ var t=e.target; return t&&t.closest? t.closest(".su[data-tip]") : null; }
  document.addEventListener("mouseover",function(e){ var el=tipEl(e); if(el) showTip(el); });
  document.addEventListener("mouseout",function(e){ var el=tipEl(e); if(el&&!(e.relatedTarget&&el.contains(e.relatedTarget))) hideTip(); });
  document.addEventListener("focusin",function(e){ var el=tipEl(e); if(el) showTip(el); });
  document.addEventListener("focusout",function(e){ if(tipEl(e)) hideTip(); });
  document.addEventListener("click",function(e){ var el=tipEl(e); if(el){ if(TIPON===el) hideTip(); else showTip(el); } else if(TIPON) hideTip(); });
  window.addEventListener("scroll",hideTip,{passive:true});

    var jb=e.target.closest("[data-jump]"); if(jb){ var el=document.getElementById(jb.getAttribute("data-jump")); if(el){ if(el.tagName==="DETAILS") el.open=true; window.scrollTo({top:el.getBoundingClientRect().top+window.pageYOffset-64,behavior:"smooth"}); } return; }
    var c=e.target.closest("[data-f]"); if(c){ FILTER[c.getAttribute("data-p")]=c.getAttribute("data-f"); paint(); return; }
    var t=e.target.closest("[data-v]"); if(t){ go(t.getAttribute("data-v")); return; }
    if(e.target.closest("#teamtoggle")){ TEAM=!TEAM; try{ if(TEAM) localStorage.removeItem("cf-team"); else localStorage.setItem("cf-team","0"); }catch(err){} SRC.C=TEAM?"Command Center":"KEILTY team"; paint(); }
  });
  var hh=(location.hash||"").slice(1);
  if(hh && (hh==="overview" || F.properties.some(function(p){return p.id===hh;}))) VIEW=hh;
  paint();
})();
</script>
